<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <!-- Circular Background -->
    <circle cx="250" cy="250" r="240" fill="#246a41" />

    <!-- Dashed inner border -->
    <circle cx="250" cy="250" r="225" fill="none" stroke="#2c7c4e" stroke-width="2" stroke-dasharray="10 6" />

    <!-- Subtle circuit background circles -->
    <circle cx="250" cy="250" r="140" fill="none" stroke="#297349" stroke-width="1" />
    <circle cx="250" cy="250" r="200" fill="none" stroke="#297349" stroke-width="1" />

    <!-- Group containing the core logo logic, shifted to center in 500x500 -->
    <g transform="translate(-50, 40)">
        
        <!-- Hexagon -->
        <polygon points="300,70 370,110 370,190 300,230 230,190 230,110" fill="none" stroke="#3ce288" stroke-width="3" opacity="0.8"/>
        <polygon points="300,60 380,105 380,195 300,240 220,195 220,105" fill="none" stroke="#277d4f" stroke-width="2"/>

        <!-- Circuit lines radiating from Hexagon -->
        <path d="M 340,70 L 340,40 L 360,20" fill="none" stroke="#3ce288" stroke-width="2" opacity="0.6"/>
        <circle cx="360" cy="20" r="3" fill="#3ce288" opacity="0.6" />

        <path d="M 370,130 L 400,130 L 400,100 L 430,100" fill="none" stroke="#3ce288" stroke-width="2" opacity="0.6"/>
        <circle cx="430" cy="100" r="3" fill="#3ce288" opacity="0.6" />

        <path d="M 350,200 L 350,230 L 370,250" fill="none" stroke="#3ce288" stroke-width="2" opacity="0.6"/>
        <circle cx="370" cy="250" r="3" fill="#3ce288" opacity="0.6" />

        <path d="M 250,200 L 250,230 L 230,250" fill="none" stroke="#3ce288" stroke-width="2" opacity="0.6"/>
        <circle cx="230" cy="250" r="3" fill="#3ce288" opacity="0.6" />

        <path d="M 230,130 L 200,130 L 200,160 L 170,160" fill="none" stroke="#3ce288" stroke-width="2" opacity="0.6"/>
        <circle cx="170" cy="160" r="3" fill="#3ce288" opacity="0.6" />

        <circle cx="300" cy="250" r="4" fill="#3ce288" opacity="0.6" />

        <!-- Leaf Core -->
        <path d="M 300,90 C 330,90 350,110 350,150 C 350,190 320,210 300,210 C 280,210 250,190 250,150 C 250,110 270,90 300,90 Z" fill="#4ade80" />
        <path d="M 300,90 C 330,90 350,110 350,150 C 350,190 320,210 300,210 L 300,90" fill="#6ee7b7" />
        
        <!-- Leaf veins -->
        <line x1="300" y1="95" x2="300" y2="205" stroke="#a7f3d0" stroke-width="2" />
        <path d="M 300,120 L 280,110" stroke="#a7f3d0" stroke-width="1.5" />
        <path d="M 300,140 L 320,130" stroke="#a7f3d0" stroke-width="1.5" />
        <path d="M 300,160 L 275,150" stroke="#a7f3d0" stroke-width="1.5" />
        <path d="M 300,180 L 325,170" stroke="#a7f3d0" stroke-width="1.5" />

        <!-- Main Title -->
        <text x="295" y="300" font-family="'Outfit', sans-serif, Arial" font-size="64" font-weight="700" text-anchor="middle" letter-spacing="2">
            <tspan fill="#ffffff">Agro</tspan><tspan fill="#3ce288">Tech</tspan>
        </text>

        <!-- Title Underline accents -->
        <line x1="160" y1="312" x2="280" y2="312" stroke="#3ce288" stroke-width="2" opacity="0.8"/>
        <line x1="290" y1="312" x2="450" y2="312" stroke="#256e46" stroke-width="2" />

        <!-- Subtitle -->
        <text x="300" y="340" font-family="'Outfit', sans-serif, Arial" font-size="14" font-weight="400" fill="#a8cbb8" text-anchor="middle" letter-spacing="6">SMART FARMING SOLUTIONS</text>

        <!-- EST Date -->
        <line x1="210" y1="370" x2="250" y2="370" stroke="#256e46" stroke-width="1" />
        <text x="300" y="374" font-family="'Outfit', sans-serif, Arial" font-size="12" font-weight="300" fill="#69a584" text-anchor="middle" letter-spacing="4">EST. 2026</text>
        <line x1="350" y1="370" x2="390" y2="370" stroke="#256e46" stroke-width="1" />

    </g>
</svg>
